<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPresent - Flexible Presentation App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="toolbar">
            <div class="toolbar-left">
                <h1>FlexPresent</h1>
            </div>
            <div class="toolbar-center">
                <button id="addMediaBtn" class="btn btn-primary">
                    <span>📎</span> Add Media
                </button>
                <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;">

                <div class="btn-group">
                    <button id="layoutCircleBtn" class="btn btn-secondary" title="Arrange in Circle">
                        <span>⭕</span> Circle
                    </button>
                    <button id="layoutCurveBtn" class="btn btn-secondary" title="Arrange in Curve">
                        <span>〰️</span> Curve
                    </button>
                    <button id="layoutGridBtn" class="btn btn-secondary" title="Arrange in Grid">
                        <span>▦</span> Grid
                    </button>
                    <button id="layoutLineBtn" class="btn btn-secondary" title="Arrange in Line">
                        <span>━</span> Line
                    </button>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="bgColorBtn" class="btn btn-secondary" title="Background Color">
                    <span>🎨</span>
                </button>
                <input type="color" id="bgColorPicker" value="#2c3e50" style="display: none;">

                <button id="bgImageBtn" class="btn btn-secondary" title="Background Image">
                    <span>🖼️</span>
                </button>
                <input type="file" id="bgImageInput" accept="image/*" style="display: none;">

                <button id="clearBgBtn" class="btn btn-secondary" title="Clear Background">
                    <span>🗑️</span>
                </button>

                <button id="saveBtn" class="btn btn-success" title="Save Presentation">
                    <span>💾</span> Save
                </button>
                <button id="loadBtn" class="btn btn-success" title="Load Presentation">
                    <span>📂</span> Load
                </button>
                <input type="file" id="loadInput" accept=".json" style="display: none;">
            </div>
        </header>

        <!-- Main Playfield -->
        <div class="playfield-container">
            <div id="playfield" class="playfield">
                <!-- Cards will be added here dynamically -->
            </div>
        </div>

        <!-- Card Orientation Selector Modal -->
        <div id="orientationModal" class="modal hidden">
            <div class="modal-content">
                <h2>Select Card Orientation</h2>
                <div class="orientation-options">
                    <button id="landscapeBtn" class="orientation-btn">
                        <div class="orientation-preview landscape"></div>
                        <span>Landscape</span>
                    </button>
                    <button id="portraitBtn" class="orientation-btn">
                        <div class="orientation-preview portrait"></div>
                        <span>Portrait</span>
                    </button>
                </div>
                <button id="cancelOrientationBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>

        <!-- Maximized Card View -->
        <div id="maximizedView" class="maximized-view hidden">
            <div class="maximized-content">
                <button id="closeMaximizedBtn" class="close-btn">✕</button>
                <div id="maximizedMediaContainer" class="maximized-media-container">
                    <!-- Media will be displayed here -->
                </div>
                <div class="zoom-indicator">Scroll to zoom</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
