<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage Persistence Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5568d3;
        }
        #status {
            font-size: 18px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <h1>localStorage Persistence Test</h1>

    <div class="box">
        <h3>Test Data:</h3>
        <p id="status"></p>
        <p><strong>Last saved:</strong> <span id="timestamp"></span></p>
    </div>

    <div class="box">
        <h3>Actions:</h3>
        <button onclick="saveData()">Save Test Data</button>
        <button onclick="location.reload()">Regular Refresh (F5)</button>
        <button onclick="location.reload(true)">Hard Refresh (Ctrl+F5)</button>
        <button onclick="clearData()">Clear localStorage</button>
    </div>

    <div class="box">
        <h3>Instructions:</h3>
        <ol>
            <li><strong>Click "Save Test Data"</strong> - saves data to localStorage</li>
            <li><strong>Close the browser completely</strong> and reopen</li>
            <li><strong>Navigate back to this page</strong></li>
            <li>Data should still be there! ✅</li>
        </ol>
        <p><em>Note: Won't work in incognito/private mode</em></p>
    </div>

    <script>
        function saveData() {
            const data = {
                message: 'This data survived!',
                timestamp: new Date().toISOString(),
                count: (getData()?.count || 0) + 1
            };
            localStorage.setItem('persistenceTest', JSON.stringify(data));
            displayData();
        }

        function getData() {
            const saved = localStorage.getItem('persistenceTest');
            return saved ? JSON.parse(saved) : null;
        }

        function displayData() {
            const data = getData();
            if (data) {
                document.getElementById('status').innerHTML =
                    `✅ <strong>${data.message}</strong> (Survived ${data.count} saves)`;
                document.getElementById('timestamp').textContent =
                    new Date(data.timestamp).toLocaleString();
            } else {
                document.getElementById('status').innerHTML =
                    '❌ No data saved yet';
                document.getElementById('timestamp').textContent = 'Never';
            }
        }

        function clearData() {
            localStorage.removeItem('persistenceTest');
            displayData();
        }

        // Display on load
        displayData();
    </script>
</body>
</html>
